<script setup>
import { ref, reactive, watch, nextTick } from 'vue'
import * as echarts from 'echarts'

// Config
const maxIterations = 5

// State
const isGenerating = ref(false)
const iterations = ref([])
const finalResult = ref(null)
const chartRef = ref(null)
let chartInstance = null

// Batch
const showBatchModal = ref(false)
const batchResults = ref([])

// Parameters
const params = reactive({
  gender: 'female',
  hair: 'silver',
  hair_length: 'long',
  eye_color: 'red',
  style: 'anime',
  outfit: 'armor',
  pose: 'standing',
  expression: 'serious',
  threshold: 0.85
})

// Mock evaluation function
function mockEvaluate(target, iteration) {
  const scores = {}
  const keys = ['hair', 'eye', 'style', 'outfit', 'pose']
  
  let baseScore = 0.65 + (iteration * 0.05) + Math.random() * 0.08
  
  for (const key of keys) {
    const val = params[key]
    const seed = (val.charCodeAt(0) * 100 + iteration * 10) % 100
    scores[key] = Math.min(0.98, Math.max(0.5, baseScore + (Math.sin(seed) * 0.15)))
  }
  
  const overall = Object.values(scores).reduce((a, b) => a + b, 0) / Object.values(scores).length
  
  return {
    score: overall,
    breakdown: Object.fromEntries(
      Object.entries(scores).map(([k, v]) => [k, parseFloat(v.toFixed(3))])
    ),
    passed: overall >= params.threshold
  }
}

// Simulate generation
async function simulateGeneration() {
  const currentParams = { ...params }
  delete currentParams.threshold
  
  iterations.value = []
  finalResult.value = null
  
  let currentScore = 0
  let weights = { hair: 1.0, eye: 1.0, style: 1.0, outfit: 1.0, pose: 1.0 }
  
  for (let i = 0; i < maxIterations; i++) {
    await new Promise(r => setTimeout(r, 800))
    
    const evalResult = mockEvaluate(currentParams, i)
    currentScore = evalResult.score
    
    const iteration = {
      score: currentScore,
      breakdown: evalResult.breakdown,
      passed: evalResult.passed,
      promptAdjustment: null,
      weightChanges: null
    }
    
    // Simulate weight adjustment if not passed
    if (!evalResult.passed && i < maxIterations - 1) {
      // Find worst dimension
      const worst = Object.entries(evalResult.breakdown)
        .sort((a, b) => a[1] - b[1])[0]
      
      const adjustment = {}
      adjustment[worst[0]] = weights[worst[0]] + 0.3
      
      weights = { ...weights, ...adjustment }
      
      iteration.weightChanges = adjustment
      iteration.promptAdjustment = {
        before: `(${worst[0]}:1.0)`,
        after: `(${worst[0]}:${adjustment[worst[0]].toFixed(1)})`
      }
    }
    
    iterations.value.push(iteration)
    updateChart()
    
    if (evalResult.passed) {
      break
    }
  }
  
  finalResult.value = {
    score: currentScore,
    params: { ...currentParams }
  }
  
  isGenerating.value = false
}

// Start generation
function startGeneration() {
  isGenerating.value = true
  simulateGeneration()
}

// Start batch generation
function startBatchGeneration() {
  isGenerating.value = true
  batchResults.value = []
  
  const runBatch = async () => {
    for (let i = 0; i < 10; i++) {
      await new Promise(r => setTimeout(r, 500))
      
      // Randomize params slightly
      const hairOptions = ['silver', 'black', 'blonde', 'blue', 'red', 'pink']
      params.hair = hairOptions[Math.floor(Math.random() * hairOptions.length)]
      
      const evalResult = mockEvaluate(params, 0)
      
      batchResults.value.push({
        score: evalResult.score,
        params: { hair: params.hair, style: params.style, outfit: params.outfit }
      })
    }
    
    isGenerating.value = false
    showBatchModal.value = true
  }
  
  runBatch()
}

// Update chart
function updateChart() {
  nextTick(() => {
    if (!chartRef.value) return
    
    if (!chartInstance) {
      chartInstance = echarts.init(chartRef.value)
    }
    
    const xData = iterations.value.map((_, i) => `第${i}轮`)
    const scoreData = iterations.value.map(iter => iter.score)
    const thresholdData = iterations.value.map(() => params.threshold)
    
    chartInstance.setOption({
      tooltip: {
        trigger: 'axis',
        formatter: (p) => `${p[0].name}<br/>评分: ${p[0].value.toFixed(4)}`
      },
      grid: {
        left: '3%',
        right: '4%',
        bottom: '3%',
        top: '10%',
        containLabel: true
      },
      xAxis: {
        type: 'category',
        data: xData,
        boundaryGap: false
      },
      yAxis: {
        type: 'value',
        min: 0.5,
        max: 1.0
      },
      series: [
        {
          name: '评分',
          type: 'line',
          data: scoreData,
          smooth: true,
          lineStyle: { width: 3 },
          itemStyle: { color: '#4ecdc4' },
          areaStyle: {
            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
              { offset: 0, color: 'rgba(78, 205, 196, 0.4)' },
              { offset: 1, color: 'rgba(78, 205, 196, 0.05)' }
            ])
          }
        },
        {
          name: '阈值',
          type: 'line',
          data: thresholdData,
          lineStyle: { width: 2, type: 'dashed' },
          itemStyle: { color: '#ff6b6b' },
          symbol: 'none'
        }
      ]
    })
  })
}
</script>
